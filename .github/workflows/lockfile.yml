# .github/workflows/lockfile.yml
name: Refresh lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - codex/01-cloud-foundation

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: \${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: refresh npm lockfile"
          git push
  unit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: \${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:unit -- tests/unit/service-id.test.ts
      - run: npm run format:check
  format-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: \${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Format the audited baseline files
        shell: bash
        run: |
          files=(
            workers/app.ts
            tests/worker/content-repository.test.ts
            tests/unit/config-contract.test.ts
            tests/unit/cloudflare-context.test.ts
            app/types/node-fs-promises.d.ts
            app/routes.ts
            app/routes/language-redirect.tsx
            app/root.tsx
            app/lib/cloudflare/context.ts
            tests/helpers/apply-migrations.ts
            scripts/render-wrangler-config.mjs
          )
          npx biome format --write "\${files[@]}"
      - name: Commit audited formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workers/app.ts tests/worker/content-repository.test.ts tests/unit/config-contract.test.ts tests/unit/cloudflare-context.test.ts app/types/node-fs-promises.d.ts app/routes.ts app/routes/language-redirect.tsx app/root.tsx app/lib/cloudflare/context.ts tests/helpers/apply-migrations.ts scripts/render-wrangler-config.mjs
          git diff --cached --quiet || git commit -m "style: normalize audited Biome baseline"
          git push
