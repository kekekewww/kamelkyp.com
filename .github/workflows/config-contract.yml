name: Cloud configuration contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/01-cloud-foundation

permissions:
  contents: read

jobs:
  config-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Only these two files: `npm run test:worker` adds the whole tests/worker
      # directory (the ci worker job runs it). tests/unit/config-contract.test.ts
      # checks both files exist, since Vitest fails only when no filter matches.
      - run: npx vitest run --config vitest.worker.config.ts tests/worker/migrations.test.ts tests/worker/public-terms.test.ts
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config build/server/wrangler.json
