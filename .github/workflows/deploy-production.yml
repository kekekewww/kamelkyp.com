name: production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test isolated loopback Worker
        run: npm run test:e2e:ci
      - name: Render production Worker configuration
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          RATE_LIMIT_NAMESPACE_ID: ${{ vars.RATE_LIMIT_NAMESPACE_ID }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: node scripts/render-wrangler-config.mjs production
      - name: Render ephemeral production secrets
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_HMAC_SECRET: ${{ secrets.APPS_SCRIPT_HMAC_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
        run: node scripts/render-worker-secrets.mjs production
      - name: Verify production release contract
        env:
          MODE: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_HMAC_SECRET: ${{ secrets.APPS_SCRIPT_HMAC_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          RATE_LIMIT_NAMESPACE_ID: ${{ vars.RATE_LIMIT_NAMESPACE_ID }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          LEGAL_REVIEW_CONFIRMED: ${{ vars.LEGAL_REVIEW_CONFIRMED }}
        run: npm run verify:production
      - name: Record pre-migration D1 bookmark
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BOOKMARK_OUTPUT="$(npx wrangler d1 time-travel info kamelkyp-production --config build/server/.wrangler.generated.jsonc)"
          echo '## Pre-migration D1 bookmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$BOOKMARK_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply kamelkyp-production --remote --config build/server/.wrangler.generated.jsonc
      - name: Deploy production Worker and secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config build/server/.wrangler.generated.jsonc --secrets-file .wrangler.secrets.json
      - name: Verify deployed secret names
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret list --name kamelkyp-com --json > .worker-secret-list.json
          node -e "const fs=require('fs');const actual=JSON.parse(fs.readFileSync('.worker-secret-list.json','utf8')).map(x=>x.name).sort();const expected=['APPS_SCRIPT_HMAC_SECRET','APPS_SCRIPT_URL','CSRF_SECRET','TURNSTILE_SECRET'];if(JSON.stringify(actual)!==JSON.stringify(expected))process.exit(1)"
      - name: Remove generated deployment files
        if: always()
        shell: bash
        run: rm -f build/server/.wrangler.generated.jsonc .wrangler.secrets.json .worker-secret-list.json
      - name: Production health and public smoke test
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 5 --retry-all-errors https://kamelkyp.com/health
          curl --fail --show-error --silent --retry 5 --retry-all-errors https://kamelkyp.com/zh > /dev/null
